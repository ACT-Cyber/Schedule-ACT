<article class="cp-import" data-print>
  <div class="plate" data-plate>
    <header>
      <img src="img/ACT.webp" alt="">
      <strong>actglobal</strong>
    </header>

    <h1 data-field="title"></h1>

    <div class="route">
      <span class="place" data-field="origin"></span>
      <span class="to">TO</span>
      <span class="place" data-field="destination"></span>
    </div>

    <ul class="info">
      <li>
        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15l2 4h14l2-4z"/><path d="M6 15V9h12v6M12 4v5M9 12h6"/></svg></span>
        <span class="label">VESSEL</span>
        <span class="value"><span data-field="vessel"></span><span data-field="voyage"></span></span>
      </li>
      <li>
        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17.5h2M14 17.5h2"/></svg></span>
        <span class="label">CFS</span>
        <span class="value" data-field="cfs"></span>
      </li>
      <li>
        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15l2 4h14l2-4z"/><path d="M6 15V9h12v6M12 4v5M9 12h6"/></svg></span>
        <span class="label">ETD</span>
        <span class="value" data-field="etd"></span>
      </li>
      <li>
        <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <span class="label">ETA</span>
        <span class="value" data-field="eta"></span>
      </li>
    </ul>

    <footer>
      <span data-field="address"></span>
      <span data-field="site"></span>
    </footer>
  </div>
</article>
