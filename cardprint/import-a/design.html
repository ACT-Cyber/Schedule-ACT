<article class="cp-import" data-print>
  <div class="plate" data-plate>
    <header>
      <img src="../../img/ACT.webp" alt="">
      <strong>actglobal</strong>
    </header>
    <h1 data-field="title"></h1>
    <p class="banner"><span data-field="vessel"></span><span data-field="voyage"></span></p>
    <div class="dates">
      <div><span>ETD</span><b data-field="etd"></b></div>
      <div><span>CFS</span><b data-field="cfs"></b></div>
      <div><span>ETA</span><b data-field="eta"></b></div>
    </div>
    <div class="route">
      <span data-field="origin"></span>
      <i></i>
      <span data-field="destination"></span>
    </div>
  </div>
  <footer>
    <span data-field="address"></span>
    <span data-field="site"></span>
  </footer>
</article>
