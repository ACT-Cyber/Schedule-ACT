<!-- @format -->

<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-storage-key" content="schedule-act-theme" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>ACT Global - Freight Services</title>

    <link rel="icon" type="image/webp" href="/img/favicon.webp" />

    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        try {
          var key = document.querySelector(
            'meta[name="theme-storage-key"]',
          ).content;
          var saved = localStorage.getItem(key);
          document.documentElement.setAttribute(
            "data-theme",
            saved === "dark" || saved === "light" ? saved : "light",
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- <a class="skip-link" href="#cards">Skip to schedules</a> -->

    <header class="app-header">
      <div class="wrap">
        <div class="brand-row">
          <div class="brand">
            <div class="mark" aria-hidden="true">
              <img src="img/ACT.webp" alt="" />
            </div>
            <div>
              <h1 id="appTitle">Schedule ACT</h1>
              <p id="appTagline">Vessel & voyage logistics</p>
            </div>
          </div>
          <button
            id="themeToggle"
            class="icon-btn"
            type="button"
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <svg
              class="theme-icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path
                stroke-linecap="round"
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg
              class="theme-icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="sticky-bar">
      <div class="wrap">
        <div class="control-row">
          <div class="switch-field">
            <!-- <span id="currentMonthLabel">Current month</span> -->
            <button
              id="currentMonthToggle"
              class="switch"
              type="button"
              role="switch"
              aria-checked="true"
              aria-labelledby="currentMonthLabel"
            >
              <i></i>
            </button>
            <span id="activeMonthBadge" class="badge">Oct</span>
          </div>

          <div class="search-wrap">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                d="M21 21l-4.3-4.3M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0z"
              />
            </svg>
            <!-- <label class="sr-only" for="searchInput">Search schedules</label> -->
            <input
              id="searchInput"
              type="search"
              autocomplete="off"
              enterkeyhint="search"
            />
            <button
              id="clearSearchBtn"
              class="clear-btn"
              type="button"
              hidden
              aria-label="Clear search"
            >
              ×
            </button>
          </div>

          <div id="monthPickerContainer" class="month-picker">
            <!-- <label class="sr-only" for="monthPicker">Month</label> -->
            <select id="monthPicker" class="select"></select>
          </div>

          <!-- <label class="sr-only" for="groupBySelect">Group by</label> -->
          <select
            id="groupBySelect"
            class="select"
            aria-label="Group by"
          ></select>
        </div>

        <div class="tool-row">
          <div
            id="categoryPillContainer"
            class="pills"
            role="toolbar"
            aria-label="Categories"
          ></div>
          <div class="tool-actions">
            <button
              id="sortDurationBtn"
              class="sort-btn"
              type="button"
              aria-label="Sort by duration"
            >
              <span id="sortDurationLabel">➖</span>
            </button>
            <button id="resetBtn" class="text-btn" type="button">❌</button>
          </div>
        </div>
      </div>
    </div>

    <main class="wrap">
      <div class="status-line">
        <p id="resultCountLabel">
          Showing <strong id="itemCount">0</strong> schedules
        </p>
        <div class="source-side">
          <div id="dataSourceTag" class="source">Data: …</div>
          <button id="bulkBtn" class="bulk-btn" type="button" aria-label="Bulk">
            🖨️
          </button>
        </div>
      </div>
      <p id="liveStatus" class="sr-only" aria-live="polite"></p>
      <div id="cards" class="cards"></div>
      <p class="help-note" id="cfsHelp"></p>
    </main>

    <footer class="app-footer">
      <div class="wrap">
        <p>&copy; 2026 Schedule ACT. <a href="#">@Patramap</a>.</p>
        <!-- <p>Dates parsed as DD/MM/YYYY, with ISO fallback.</p> -->
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="CONFIG.js"></script>
    <script src="main.js"></script>
    <script src="cardprint/index.js"></script>
    <script src="bulk.js"></script>
  </body>
</html>
